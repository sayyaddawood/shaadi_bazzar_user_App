name: iOS TestFlight

# Manually triggered: builds the WedEasy iOS app (Release, App Store signing)
# and uploads it to App Store Connect / TestFlight. It never submits for review.
on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload the .ipa to App Store Connect (TestFlight)"
        type: boolean
        default: true
      build_number:
        description: "Override CFBundleVersion (leave empty to use CURRENT_PROJECT_VERSION from the project)"
        type: string
        required: false
        default: ""

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      # App Store uploads require Xcode 26+ / iOS 26 SDK (since 2026-04-28).
      # 26.3 is the newest Xcode on macos-15 and predates the Xcode 26.4 fmt/consteval break.
      XCODE_APP: /Applications/Xcode_26.3.app
      WORKSPACE: ShadiBazaar.xcworkspace
      SCHEME: ShadiBazaar
      CONFIGURATION: Release
      ARCHIVE_PATH: ${{ github.workspace }}/build/WedEasy.xcarchive
      EXPORT_PATH: ${{ github.workspace }}/build/export
      PROFILE_NAME: WedEasy AppStore CI
      NODE_OPTIONS: --max-old-space-size=6144

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install JS dependencies
        # No yarn.lock is committed, so a frozen lockfile is not possible.
        run: yarn install --non-interactive --network-timeout 600000

      - name: Install pods
        working-directory: ios
        run: |
          pod --version
          pod install --repo-update  # Podfile.lock is not committed

      - name: Install signing certificate and provisioning profile
        env:
          IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/dist.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$IOS_DIST_P12_BASE64" | base64 --decode > "$CERT_PATH"
          echo -n "$IOS_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_DIST_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< "$(security cms -D -i "$PROFILE_PATH")")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' /dev/stdin <<< "$(security cms -D -i "$PROFILE_PATH")")
          echo "Provisioning profile: $NAME ($UUID)"
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$PROFILE_PATH" "$dir/$UUID.mobileprovision"
          done
          rm -f "$CERT_PATH"

      - name: Override build number
        if: ${{ inputs.build_number != '' }}
        working-directory: ios
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          [[ "$BUILD_NUMBER" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]] || { echo "Invalid build number"; exit 1; }
          sed -i '' -E "s/CURRENT_PROJECT_VERSION = [0-9.]+;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/g" ShadiBazaar.xcodeproj/project.pbxproj
          grep -n "CURRENT_PROJECT_VERSION" ShadiBazaar.xcodeproj/project.pbxproj

      - name: Archive
        working-directory: ios
        # Manual App Store signing is configured in the project for the app
        # target's Release config only, so Pods are not signed with the profile.
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            | xcbeautify --renderer github-actions

      - name: Export .ipa
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist ExportOptions.plist \
            | xcbeautify --renderer github-actions
          ls -la "$EXPORT_PATH"

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: WedEasy-ipa-${{ github.run_number }}
          path: ${{ env.EXPORT_PATH }}/*.ipa
          retention-days: 14
          if-no-files-found: error

      - name: Upload dSYMs artifact
        uses: actions/upload-artifact@v4
        with:
          name: WedEasy-dSYMs-${{ github.run_number }}
          path: ${{ env.ARCHIVE_PATH }}/dSYMs
          retention-days: 14
          if-no-files-found: warn

      - name: Upload to App Store Connect (TestFlight)
        if: ${{ inputs.upload }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_FILE="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo -n "$ASC_KEY_P8_BASE64" | base64 --decode > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          IPA=$(ls "$EXPORT_PATH"/*.ipa | head -n 1)
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" \
            --output-format normal

      - name: Clean up keychain and keys
        if: ${{ always() }}
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
          rm -f "$HOME/.appstoreconnect/private_keys/"AuthKey_*.p8
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision
          rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/"*.mobileprovision
